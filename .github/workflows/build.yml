name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  esp32c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e esp32c3

      # copy_firmware.py drops firmware.bin in the project root; releases ship it as nous.bin
      - name: Rename to nous.bin
        run: cp firmware.bin nous.bin

      - uses: actions/upload-artifact@v4
        with:
          name: nous-${{ github.run_number }}-${{ github.sha }}
          path: nous.bin
          if-no-files-found: error

      # tag push (v*) -> GitHub release with nous.bin attached
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nous.bin
          generate_release_notes: true
